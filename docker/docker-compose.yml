services:

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"   # MQTT TCP
      - "9001:9001"   # MQTT WebSocket (Node-RED dashboard)
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    restart: unless-stopped

  simulator:
    build: ./simulator
    container_name: pump_simulator
    volumes:
      - ../nodered/pump_simulator.py:/app/pump_simulator.py:ro
    command: >
      python pump_simulator.py
      --broker mosquitto
      --id bj-deadbeef
    depends_on:
      - mosquitto
    restart: unless-stopped

  nodered:
    image: nodered/node-red:latest
    container_name: nodered
    ports:
      - "1880:1880"
    volumes:
      - nodered-data:/data
    depends_on:
      - mosquitto
    restart: unless-stopped
    environment:
      - TZ=America/Mexico_City

volumes:
  mosquitto-data:
  mosquitto-log:
  nodered-data:
